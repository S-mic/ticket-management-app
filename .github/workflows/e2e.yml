name: E2E tests (React)

on:
  push:
    branches: [main]
    paths: ['react-version/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['react-version/**', '.github/workflows/e2e.yml']

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-version/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            react-version/playwright-report
            react-version/test-results
          retention-days: 7
